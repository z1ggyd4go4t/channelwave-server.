<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>ChannelWave</title>
<style>
  :root{
    --dial-black:#0e1013;
    --dial-panel:#181b20;
    --brass:#8fc4ee;
    --brass-dim:#4d7699;
    --amber:#5ec8ff;
    --amber-dim:#2a5570;
    --paper:#dbe6f0;
    --paper-dim:#7c8a99;
    --static:#2c3038;
    --good:#7fbf9f;
    --bad:#d97777;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .radio-app{
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #1c222b 0%, var(--dial-black) 60%);
    color:var(--paper);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 12px 40px;
  }
  .brand{ text-align:center; margin-bottom:12px; }
  .brand .eyebrow{ letter-spacing:.3em; font-size:10px; color:var(--brass-dim); text-transform:uppercase; }
  .brand h1{ font-family:Georgia, serif; font-size:24px; margin:2px 0 0; letter-spacing:.03em; }
  .brand h1 span{ color:var(--amber); }

  .console{
    width:100%; max-width:560px;
    background:linear-gradient(180deg,#1c2027,#12151a);
    border:1px solid #2a3038; border-radius:14px;
    padding:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .console.mention-flash{
    animation: mention-glow 1.1s ease-in-out 2;
  }
  @keyframes mention-glow{
    0%, 100%{ border-color:#2a3038; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04); }
    50%{ border-color:#fff7d6; box-shadow:0 0 0 3px rgba(255,247,214,.55), 0 0 30px 6px rgba(255,224,102,.5); }
  }

  .mention{ font-weight:bold; }

  .mention-dropdown{
    background:#141920; border:1px solid #2a3038; border-radius:8px;
    margin-top:6px; max-height:140px; overflow-y:auto;
  }
  .mention-dropdown div{
    padding:6px 10px; font-size:13px; cursor:pointer;
  }
  .mention-dropdown div:hover, .mention-dropdown div.active{
    background:#1e242c;
  }

  .attach-preview{
    display:flex; align-items:center; gap:8px; background:#141920;
    border:1px solid #2a3038; border-radius:8px; padding:6px; margin-top:6px;
  }
  .attach-preview img{
    max-height:70px; max-width:120px; border-radius:6px; object-fit:cover;
  }
  .attach-preview button{
    margin-left:auto; background:none; border:1px solid #3a4450; color:var(--paper);
    border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:12px;
  }

  .name-color-swatch{
    display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px;
  }

  .tuner-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--dial-panel);
    border:1px solid #2a3038;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:10px;
  }
  .tuner-bar button{
    background:linear-gradient(180deg,#1e242c,#141920);
    border:1px solid #3a4450;
    color:var(--paper);
    font-family:inherit;
    font-size:12px;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .freq-readout{
    font-size:19px;
    color:var(--amber);
    text-shadow:0 0 10px rgba(94,200,255,.5);
    min-width:58px;
    text-align:center;
    flex-shrink:0;
  }
  .freq-readout small{ font-size:11px; color:var(--brass-dim); }
  .tuner-bar input[type=number]{
    width:48px;
    background:#0e1116;
    border:1px solid #3a4450;
    color:var(--amber);
    font-family:inherit;
    text-align:center;
    border-radius:6px;
    font-size:13px;
    padding:5px 2px;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--bad);
    flex-shrink:0;
  }
  .status-dot.live{ background:var(--good); box-shadow:0 0 6px var(--good); }
  .lock-btn{
    margin-left:auto;
    font-size:14px !important;
  }

  .sub-row{
    display:flex; gap:8px; margin-bottom:10px; align-items:center;
  }
  .sub-row input{
    flex:1;
    background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:8px 10px; border-radius:8px; font-size:13px;
  }
  .member-count{ font-size:11px; color:var(--paper-dim); white-space:nowrap; }

  .icon-btn{
    background:linear-gradient(180deg,#1e242c,#141920);
    border:1px solid #3a4450;
    color:var(--paper);
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn.active{ border-color:var(--amber); box-shadow:0 0 6px rgba(94,200,255,.4); }

  .speaker{
    background:#0b0d10; border:1px solid #2a3038; border-radius:10px;
    padding:10px; height:320px; overflow-y:auto;
    display:flex; flex-direction:column; gap:7px;
  }
  .speaker::-webkit-scrollbar{ width:8px; }
  .speaker::-webkit-scrollbar-thumb{ background:#2a3038; border-radius:4px; }

  .transmission{
    max-width:82%; padding:7px 10px; border-radius:9px;
    font-size:13px; line-height:1.4; background:#181d24;
    border:1px solid #2a3038; align-self:flex-start;
  }
  .transmission.mine{ align-self:flex-end; background:#1a2a38; border-color:var(--amber-dim); }
  .transmission .who{ font-size:10px; color:var(--brass); margin-bottom:2px; text-transform:uppercase; }
  .transmission.mine .who{ color:var(--amber); }
  .transmission .when{ font-size:9px; color:var(--paper-dim); margin-left:6px; }
  .system-line{ align-self:center; font-size:10.5px; color:var(--paper-dim); font-style:italic; }
  .empty-static{ margin:auto; text-align:center; color:var(--paper-dim); font-size:12px; }

  .reply-quote{
    font-size:10.5px; color:var(--paper-dim); border-left:2px solid var(--amber-dim);
    padding-left:6px; margin-bottom:4px; opacity:.85;
  }
  .reply-quote b{ color:var(--brass); }

  .transmission img.gif-img{
    max-width:180px; border-radius:8px; display:block; margin-top:4px;
  }

  .msg-actions{
    display:flex; gap:6px; margin-top:4px; align-items:center;
  }
  .msg-actions button{
    background:none; border:none; color:var(--paper-dim);
    font-size:11px; cursor:pointer; padding:0;
  }
  .msg-actions button:hover{ color:var(--amber); }

  .reaction-row{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .reaction-chip{
    font-size:11px; background:#141920; border:1px solid #2a3038;
    border-radius:10px; padding:1px 6px; cursor:pointer;
  }
  .reaction-chip.mine{ border-color:var(--amber); }

  .emoji-strip{
    display:none; gap:6px; margin-top:4px; background:#141920;
    border:1px solid #2a3038; border-radius:8px; padding:4px 6px; width:fit-content;
  }
  .emoji-strip.show{ display:flex; }
  .emoji-strip span{ cursor:pointer; font-size:14px; }

  .reply-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:#141920; border:1px solid #2a3038; border-radius:8px;
    padding:6px 10px; margin-top:6px; font-size:11.5px; color:var(--paper-dim);
  }
  .reply-banner button{ background:none; border:none; color:var(--paper-dim); cursor:pointer; font-size:13px; }

  .typing-line{
    min-height:16px; font-size:11px; color:var(--brass-dim);
    font-style:italic; padding:2px 4px 0;
    display:flex; align-items:center; gap:4px;
  }
  .typing-dots{ display:inline-flex; gap:2px; }
  .typing-dots span{
    width:4px; height:4px; border-radius:50%;
    background:var(--brass-dim);
    animation: typing-bounce 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes typing-bounce{
    0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-3px); opacity:1; }
  }

  .gif-panel{
    background:#0b0d10; border:1px solid #2a3038; border-radius:10px;
    padding:8px; margin-top:6px; max-height:220px; overflow-y:auto;
  }
  .gif-tabs{
    display:flex; gap:4px; overflow-x:auto; margin-bottom:8px; padding-bottom:4px;
    border-bottom:1px solid #2a3038;
  }
  .gif-tab{
    flex-shrink:0; background:none; border:1px solid #2a3038; color:var(--paper-dim);
    font-size:10.5px; padding:5px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .gif-tab.active{ border-color:var(--amber); color:var(--amber); }
  .gif-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:8px;
  }
  .gif-grid img{
    width:100%; height:52px; object-fit:cover; border-radius:6px;
    cursor:pointer; border:1px solid #2a3038;
  }
  .gif-grid .emoji-cell{
    width:100%; height:52px; display:flex; align-items:center; justify-content:center;
    font-size:22px; border-radius:6px; cursor:pointer; border:1px solid #2a3038; background:#141920;
  }
  .gif-grid .emoji-cell:hover{ border-color:var(--amber); }
  .gif-empty{ font-size:11px; color:var(--paper-dim); grid-column:1/-1; text-align:center; padding:8px 0; }
  .gif-add{
    display:block; text-align:center; font-size:11px; color:var(--brass);
    border:1px dashed #3a4450; border-radius:8px; padding:8px; cursor:pointer;
  }

  #zoomBackdrop{ z-index:20; }
  .zoom-modal{ position:relative; max-width:90vw; max-height:85vh; }
  .zoom-modal img{
    max-width:90vw; max-height:85vh; border-radius:10px; display:block;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
  }
  .zoom-x, .zoom-star{
    position:absolute; top:-14px; width:32px; height:32px; border-radius:50%;
    border:1px solid #3a4450; background:#141920; color:var(--paper);
    cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .zoom-x{ left:-14px; }
  .zoom-star{ right:-14px; color:var(--brass); }
  .zoom-star.faved{ color:#ffe066; border-color:#ffe066; }

  .mic-row{ display:flex; gap:8px; margin-top:4px; }
  .mic-row input{
    flex:1; background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:10px 12px; border-radius:8px; font-size:14px;
  }
  .mic-row button{
    background:linear-gradient(180deg,var(--amber),#2a5570); border:none; color:#0e1116;
    font-weight:bold; padding:0 18px; border-radius:8px; cursor:pointer;
  }
  .mic-row button:disabled{ opacity:.4; cursor:not-allowed; }

  .footnote{ text-align:center; color:var(--paper-dim); font-size:10px; letter-spacing:.08em; margin-top:14px; max-width:560px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:#181b20; border:1px solid #3a4450; border-radius:12px;
    padding:18px; width:280px; text-align:center;
  }
  .modal h3{ margin:0 0 10px; font-size:14px; color:var(--amber); }
  .modal input{
    width:100%; background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:9px; border-radius:8px; margin-bottom:10px; font-size:13px;
  }
  .modal button{
    width:100%; padding:9px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg,var(--amber),#2a5570); color:#0e1116; font-weight:bold;
  }
  .modal .cancel{ background:none; border:1px solid #3a4450; color:var(--paper); margin-top:6px; }

  .ban-modal{ width:300px; }
  .ban-actions{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .ban-actions button{
    padding:8px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg,var(--amber),#2a5570); color:#0e1013; font-weight:bold; font-size:12px;
  }
  #unbanGo{ background:linear-gradient(180deg,#7fbf9f,#2a5570); }
  .ban-list{
    text-align:left; font-size:11.5px; color:var(--paper-dim);
    max-height:110px; overflow-y:auto; margin-bottom:8px;
    border-top:1px solid #2a3038; padding-top:6px;
  }
  .ban-list div{ padding:2px 0; }
  .ban-list .empty{ font-style:italic; }
</style>
</head>
<body>
<div class="radio-app">
  <div class="brand">
    <div class="eyebrow">frequency-based transmission unit</div>
    <h1>CHANNEL<span>WAVE</span></h1>
  </div>

  <div class="console">
    <div class="tuner-bar">
      <button id="tuneDown">◄</button>
      <div class="freq-readout" id="freqReadout">01<small>/100</small></div>
      <button id="tuneUp">►</button>
      <input type="number" id="freqJump" min="1" max="100" value="1">
      <button id="jumpGo">GO</button>
      <div class="status-dot" id="statusDot" title="connection status"></div>
      <button class="lock-btn" id="lockBtn" title="channel privacy">🔓</button>
      <button class="lock-btn" id="claimOwnerBtn" title="claim ownership with a code">🔑</button>
    </div>

    <div class="sub-row">
      <input id="nameInput" maxlength="18" placeholder="pick a name">
      <button class="icon-btn" id="colorBtn" title="name color">🖌️</button>
      <input type="color" id="colorPicker" value="#5ec8ff" style="display:none;">
      <span class="member-count" id="memberCount"></span>
      <button class="icon-btn" id="filterBtn" title="no slur mode">🚫</button>
      <button class="icon-btn" id="notifyBtn" title="notifications">🔔</button>
      <button class="icon-btn" id="inviteBtn" title="invite someone">👥</button>
      <button class="icon-btn" id="resetBtn" title="reset channel" style="display:none;">🗑️</button>
      <button class="icon-btn" id="banBtn" title="ban management" style="display:none;">🚷</button>
    </div>

    <div class="speaker" id="speaker">
      <div class="empty-static">connecting...</div>
    </div>

    <div class="reply-banner" id="replyBanner" style="display:none;">
      <span id="replyBannerText"></span>
      <button id="replyBannerCancel">✕</button>
    </div>

    <div class="typing-line" id="typingLine"></div>

    <div class="gif-panel" id="gifPanel" style="display:none;">
      <div class="gif-tabs" id="gifTabs">
        <button class="gif-tab active" data-tab="favorites">⭐ Favorites</button>
        <button class="gif-tab" data-tab="used">🕓 Used</button>
        <button class="gif-tab" data-tab="emojis">😀 Emojis</button>
        <button class="gif-tab" data-tab="created">🎨 Created</button>
        <button class="gif-tab" data-tab="channel">📺 In This Channel</button>
      </div>
      <div class="gif-grid" id="gifGrid"></div>
      <label class="gif-add" id="gifAddLabel" style="display:none;">
        + add a gif
        <input type="file" id="gifFileInput" accept="image/*" hidden>
      </label>
    </div>

    <div class="mention-dropdown" id="mentionDropdown" style="display:none;"></div>

    <div class="attach-preview" id="attachPreview" style="display:none;">
      <img id="attachPreviewImg" src="">
      <button id="attachPreviewRemove" title="remove">✕</button>
    </div>

    <div class="mic-row">
      <button class="icon-btn" id="gifBtn" title="gifs">🖼️</button>
      <input id="msgInput" maxlength="500" placeholder="speak into the mic..." disabled>
      <button id="sendBtn" disabled>SEND</button>
    </div>
  </div>

  <div class="footnote">CHANNELS 01–100 · INSTANT SYNC · FIRST TO JOIN OWNS THE CHANNEL</div>
</div>

<div class="modal-backdrop" id="codeModalBackdrop">
  <div class="modal">
    <h3 id="codeModalTitle">enter channel code</h3>
    <input id="codeModalInput" placeholder="code" maxlength="32">
    <button id="codeModalGo">ENTER</button>
    <button class="cancel" id="codeModalCancel">cancel</button>
  </div>
</div>

<div class="modal-backdrop" id="inviteModalBackdrop">
  <div class="modal">
    <h3>invite someone to this channel</h3>
    <input id="inviteModalInput" placeholder="their username" maxlength="18">
    <button id="inviteModalGo">SEND INVITE</button>
    <button class="cancel" id="inviteModalCancel">cancel</button>
  </div>
</div>

<div class="modal-backdrop" id="inviteBannerBackdrop">
  <div class="modal">
    <h3 id="inviteBannerTitle">invite</h3>
    <button id="inviteBannerAccept">JOIN CHANNEL</button>
    <button class="cancel" id="inviteBannerDecline">decline</button>
  </div>
</div>

<div class="modal-backdrop" id="banModalBackdrop">
  <div class="modal ban-modal">
    <h3>ban management</h3>
    <input id="banModalInput" placeholder="username" maxlength="18">
    <div class="ban-actions">
      <button id="banUserGo">ban user (kick)</button>
      <button id="banNameGo">ban name</button>
      <button id="unbanGo">unban</button>
    </div>
    <div class="ban-list" id="banListArea"></div>
    <button class="cancel" id="banModalCancel">close</button>
  </div>
</div>

<div class="modal-backdrop" id="zoomBackdrop">
  <div class="zoom-modal">
    <button id="zoomClose" class="zoom-x" title="close">✕</button>
    <button id="zoomFav" class="zoom-star" title="favorite">☆</button>
    <img id="zoomImg" src="" alt="sticker">
  </div>
</div>

<script>
(function(){
  var TOTAL_CHANNELS = 100;
  var currentChannel = 1;
  var ws = null;
  var myId = null;
  var isOwner = false;
  var isPrivate = false;
  var pendingJoinChannel = null;
  var replyingTo = null;

  var freqReadout = document.getElementById('freqReadout');
  var speaker = document.getElementById('speaker');
  var nameInput = document.getElementById('nameInput');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var statusDot = document.getElementById('statusDot');
  var lockBtn = document.getElementById('lockBtn');
  var claimOwnerBtn = document.getElementById('claimOwnerBtn');
  var memberCount = document.getElementById('memberCount');
  var freqJump = document.getElementById('freqJump');
  var typingLine = document.getElementById('typingLine');
  var filterBtn = document.getElementById('filterBtn');
  var resetBtn = document.getElementById('resetBtn');
  var banBtn = document.getElementById('banBtn');
  var banModalBackdrop = document.getElementById('banModalBackdrop');
  var banModalInput = document.getElementById('banModalInput');
  var banUserGo = document.getElementById('banUserGo');
  var banNameGo = document.getElementById('banNameGo');
  var unbanGo = document.getElementById('unbanGo');
  var banListArea = document.getElementById('banListArea');
  var banModalCancel = document.getElementById('banModalCancel');
  var gifBtn = document.getElementById('gifBtn');
  var gifPanel = document.getElementById('gifPanel');
  var gifGrid = document.getElementById('gifGrid');
  var gifFileInput = document.getElementById('gifFileInput');
  var replyBanner = document.getElementById('replyBanner');
  var replyBannerText = document.getElementById('replyBannerText');
  var replyBannerCancel = document.getElementById('replyBannerCancel');

  var codeModalBackdrop = document.getElementById('codeModalBackdrop');
  var codeModalTitle = document.getElementById('codeModalTitle');
  var codeModalInput = document.getElementById('codeModalInput');
  var codeModalGo = document.getElementById('codeModalGo');
  var codeModalCancel = document.getElementById('codeModalCancel');

  var inviteBtn = document.getElementById('inviteBtn');
  var inviteModalBackdrop = document.getElementById('inviteModalBackdrop');
  var inviteModalInput = document.getElementById('inviteModalInput');
  var inviteModalGo = document.getElementById('inviteModalGo');
  var inviteModalCancel = document.getElementById('inviteModalCancel');
  var inviteBannerBackdrop = document.getElementById('inviteBannerBackdrop');
  var inviteBannerTitle = document.getElementById('inviteBannerTitle');
  var inviteBannerAccept = document.getElementById('inviteBannerAccept');
  var inviteBannerDecline = document.getElementById('inviteBannerDecline');
  var pendingInviteChannel = null;

  var EMOJI_SET = ['👍','❤️','😂','😮','🔥'];
  var typingUsers = new Map(); // id -> { name, timeout }
  var dotsHtml = '<span class="typing-dots"><span></span><span></span><span></span></span>';

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateFreqReadout(){
    freqReadout.innerHTML = String(currentChannel).padStart(2,'0') + '<small>/100</small>';
  }

  function getName(){
    var n = nameInput.value.trim();
    if(!n) n = 'unknown';
    return n.slice(0,18);
  }

  // ---- name color ----
  var colorBtn = document.getElementById('colorBtn');
  var colorPicker = document.getElementById('colorPicker');
  var myColor = '#5ec8ff';
  try{
    var savedColor = localStorage.getItem('channelwave_color');
    if(savedColor) myColor = savedColor;
  }catch(e){}
  colorPicker.value = myColor;
  colorBtn.style.color = myColor;

  function getColor(){ return myColor; }

  colorBtn.addEventListener('click', function(){ colorPicker.click(); });
  colorPicker.addEventListener('input', function(){
    myColor = colorPicker.value;
    colorBtn.style.color = myColor;
    try{ localStorage.setItem('channelwave_color', myColor); }catch(e){}
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({ type:'setColor', color: myColor }));
    }
  });

  // ---- channel roster, for @mentions ----
  var channelMembers = []; // [{name, color}]

  // ---- load saved name for this device ----
  try{
    var savedName = localStorage.getItem('channelwave_name');
    if(savedName) nameInput.value = savedName;
  }catch(e){}

  // notifications are handled by the push module further down (works even when the tab/app is closed)

  // ---- no slur mode (client-side censor, per device) ----
  // add your own words to this list, kept as placeholders here on purpose
  var FILTERED_WORDS = ['badword1', 'badword2'];
  var filterOn = false;
  try{ filterOn = localStorage.getItem('channelwave_filter') === '1'; }catch(e){}

  function updateFilterBtn(){ filterBtn.classList.toggle('active', filterOn); }
  updateFilterBtn();

  function censor(text){
    if(!filterOn || !text) return text;
    var out = text;
    FILTERED_WORDS.forEach(function(w){
      var escaped = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('\\b' + escaped + '\\b', 'gi');
      out = out.replace(re, function(m){ return '#'.repeat(m.length); });
    });
    return out;
  }

  function escapeRegex(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightMentions(html){
    return html.replace(/@([A-Za-z0-9_]{1,18})/g, function(match, uname){
      if(uname.toLowerCase() === 'everyone'){
        return '<span class="mention" style="color:#ffe066">@everyone</span>';
      }
      var found = null;
      for(var i=0; i<channelMembers.length; i++){
        if(channelMembers[i].name.toLowerCase() === uname.toLowerCase()){ found = channelMembers[i]; break; }
      }
      if(found){
        return '<span class="mention" style="color:' + found.color + '">@' + uname + '</span>';
      }
      return match;
    });
  }

  function checkMention(text){
    if(!text) return;
    var name = getName();
    var patterns = ['everyone'];
    if(name && name.toLowerCase() !== 'unknown') patterns.push(escapeRegex(name));
    var re = new RegExp('@(' + patterns.join('|') + ')\\b', 'i');
    if(re.test(text)){
      var consoleEl = document.querySelector('.console');
      if(!consoleEl) return;
      consoleEl.classList.remove('mention-flash');
      void consoleEl.offsetWidth; // restart animation if it's already mid-flash
      consoleEl.classList.add('mention-flash');
      setTimeout(function(){ consoleEl.classList.remove('mention-flash'); }, 2400);
    }
  }

  filterBtn.addEventListener('click', function(){
    filterOn = !filterOn;
    try{ localStorage.setItem('channelwave_filter', filterOn ? '1' : '0'); }catch(e){}
    updateFilterBtn();
    var spans = speaker.querySelectorAll('.msg-text');
    spans.forEach(function(el){
      var raw = el.getAttribute('data-raw') || '';
      el.innerHTML = highlightMentions(escapeHtml(censor(raw)));
    });
  });

  // ---- notifications (PWA push, works even when the site/app is closed) ----
  var notifyBtn = document.getElementById('notifyBtn');
  var notifyOn = false;
  try{ notifyOn = localStorage.getItem('channelwave_notify') === '1'; }catch(e){}
  var swRegistration = null;

  function getClientId(){
    var id = null;
    try{ id = localStorage.getItem('channelwave_client_id'); }catch(e){}
    if(!id){
      id = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try{ localStorage.setItem('channelwave_client_id', id); }catch(e){}
    }
    return id;
  }

  function urlBase64ToUint8Array(base64String){
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for(var i=0; i<rawData.length; i++){ outputArray[i] = rawData.charCodeAt(i); }
    return outputArray;
  }

  function updateNotifyBtn(){ notifyBtn.classList.toggle('active', notifyOn); }
  updateNotifyBtn();

  function registerServiceWorker(){
    if(!('serviceWorker' in navigator)) return Promise.resolve(null);
    return navigator.serviceWorker.register('/sw.js').then(function(reg){
      swRegistration = reg;
      return reg;
    }).catch(function(){ return null; });
  }

  function subscribeToPush(){
    if(!swRegistration || !('PushManager' in window)) return;
    fetch('/vapidPublicKey').then(function(r){ return r.text(); }).then(function(vapidKey){
      return swRegistration.pushManager.getSubscription().then(function(existing){
        if(existing) return existing;
        return swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidKey)
        });
      });
    }).then(function(sub){
      if(!sub) return;
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON(), clientId: getClientId(), channel: currentChannel, name: getName() })
      });
    }).catch(function(err){ addSystemLine('could not enable notifications: ' + err.message); });
  }

  function resubscribePush(){
    if(!swRegistration) return;
    swRegistration.pushManager.getSubscription().then(function(sub){
      if(!sub) return;
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON(), clientId: getClientId(), channel: currentChannel, name: getName() })
      });
    });
  }

  function unsubscribeFromPush(){
    if(!swRegistration) return;
    swRegistration.pushManager.getSubscription().then(function(sub){
      if(!sub) return;
      fetch('/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: sub.endpoint })
      });
      sub.unsubscribe();
    });
  }

  notifyBtn.addEventListener('click', function(){
    if(notifyOn){
      notifyOn = false;
      try{ localStorage.setItem('channelwave_notify', '0'); }catch(e){}
      updateNotifyBtn();
      unsubscribeFromPush();
      return;
    }
    if(!('Notification' in window)){
      addSystemLine('notifications are not supported in this browser');
      return;
    }
    Notification.requestPermission().then(function(perm){
      if(perm !== 'granted'){
        addSystemLine('notification permission was not granted');
        return;
      }
      notifyOn = true;
      try{ localStorage.setItem('channelwave_notify', '1'); }catch(e){}
      updateNotifyBtn();
      registerServiceWorker().then(function(){ subscribeToPush(); });
    });
  });

  registerServiceWorker().then(function(){
    if(notifyOn) subscribeToPush();
  });

  // ---- sticker/gif shelf (per device, stored locally in the browser) ----
  var gifTabs = document.getElementById('gifTabs');
  var gifAddLabel = document.getElementById('gifAddLabel');
  var currentGifTab = 'favorites';
  var channelImages = []; // in-memory only: images seen in this channel this session, most recent first

  function loadList(key){
    try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; }
  }
  function saveList(key, list){
    try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){}
  }
  function loadCreated(){ return loadList('channelwave_gifs'); }
  function loadFavorites(){ return loadList('channelwave_favorites'); }
  function loadUsed(){ return loadList('channelwave_used'); }

  function rememberUsed(dataUrl){
    var used = loadUsed().filter(function(u){ return u !== dataUrl; });
    used.unshift(dataUrl);
    if(used.length > 30) used = used.slice(0, 30);
    saveList('channelwave_used', used);
  }

  function rememberChannelImage(dataUrl){
    if(!dataUrl) return;
    channelImages = channelImages.filter(function(u){ return u !== dataUrl; });
    channelImages.unshift(dataUrl);
    if(channelImages.length > 40) channelImages = channelImages.slice(0, 40);
  }

  var EMOJI_QUICKSET = ['😀','😂','😍','😎','🥳','😭','😡','👍','👎','🔥','💯','🎉','❤️','💔','🙏','👀','🤡','💀','😱','🤔'];

  function renderGifGrid(){
    gifGrid.innerHTML = '';
    gifAddLabel.style.display = (currentGifTab === 'created') ? 'block' : 'none';

    if(currentGifTab === 'emojis'){
      EMOJI_QUICKSET.forEach(function(em){
        var cell = document.createElement('div');
        cell.className = 'emoji-cell';
        cell.textContent = em;
        cell.addEventListener('click', function(){
          if(!ws || ws.readyState !== WebSocket.OPEN) return;
          ws.send(JSON.stringify({ type:'message', text: em, replyTo: replyingTo }));
          clearReply();
          gifPanel.style.display = 'none';
        });
        gifGrid.appendChild(cell);
      });
      return;
    }

    var list = [];
    if(currentGifTab === 'favorites') list = loadFavorites();
    else if(currentGifTab === 'used') list = loadUsed();
    else if(currentGifTab === 'created') list = loadCreated();
    else if(currentGifTab === 'channel') list = channelImages;

    if(list.length === 0){
      var msg = currentGifTab === 'created' ? 'no gifs saved yet, add one below' : 'nothing here yet';
      gifGrid.innerHTML = '<div class="gif-empty">' + msg + '</div>';
      return;
    }
    list.forEach(function(dataUrl){
      var img = document.createElement('img');
      img.src = dataUrl;
      img.addEventListener('click', function(){
        sendImage(dataUrl);
        gifPanel.style.display = 'none';
      });
      gifGrid.appendChild(img);
    });
  }

  gifTabs.addEventListener('click', function(e){
    var btn = e.target.closest('.gif-tab');
    if(!btn) return;
    currentGifTab = btn.getAttribute('data-tab');
    gifTabs.querySelectorAll('.gif-tab').forEach(function(t){ t.classList.toggle('active', t === btn); });
    renderGifGrid();
  });

  gifBtn.addEventListener('click', function(){
    var showing = gifPanel.style.display !== 'none';
    gifPanel.style.display = showing ? 'none' : 'block';
    if(!showing) renderGifGrid();
  });
  gifFileInput.addEventListener('change', function(){
    var file = gifFileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var gifs = loadCreated();
      gifs.push(dataUrl);
      saveList('channelwave_gifs', gifs);
      renderGifGrid();
    };
    reader.readAsDataURL(file);
    gifFileInput.value = '';
  });
  function sendImage(dataUrl){
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type:'message', text:'', image: dataUrl, replyTo: replyingTo }));
    clearReply();
    rememberUsed(dataUrl);
  }

  // ---- zoom modal: click any sticker/gif in chat to view it full size ----
  var zoomBackdrop = document.getElementById('zoomBackdrop');
  var zoomImg = document.getElementById('zoomImg');
  var zoomClose = document.getElementById('zoomClose');
  var zoomFav = document.getElementById('zoomFav');

  function openZoom(src){

  // ---- typing indicator ----
  function renderTypingLine(){
    var names = [];
    typingUsers.forEach(function(v){ names.push(v.name); });
    if(names.length === 0){ typingLine.innerHTML = ''; return; }
    var label = names.length === 1 ? (names[0] + ' is typing') : (names.join(', ') + ' are typing');
    typingLine.innerHTML = escapeHtml(label) + dotsHtml;
  }
  function markTyping(id, name){
    if(typingUsers.has(id)) clearTimeout(typingUsers.get(id).timeout);
    var timeout = setTimeout(function(){ typingUsers.delete(id); renderTypingLine(); }, 3000);
    typingUsers.set(id, { name: name, timeout: timeout });
    renderTypingLine();
  }
  function clearTypingUsers(){
    typingUsers.forEach(function(v){ clearTimeout(v.timeout); });
    typingUsers.clear();
    renderTypingLine();
  }

  // ---- websocket connection ----
  function connect(){
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = function(){ statusDot.classList.add('live'); };
    ws.onclose = function(){
      statusDot.classList.remove('live');
      setTimeout(connect, 1500);
    };
    ws.onerror = function(){};

    ws.onmessage = function(evt){
      var data;
      try{ data = JSON.parse(evt.data); }catch(e){ return; }
      handleServerMessage(data);
    };
  }

  function handleServerMessage(data){
    switch(data.type){
      case 'hello':
        myId = data.id;
        joinChannel(currentChannel);
        break;

      case 'joined':
        isOwner = data.isOwner;
        isPrivate = data.private;
        lockBtn.textContent = isPrivate ? '🔒' : '🔓';
        lockBtn.title = isOwner ? (isPrivate ? 'make public' : 'make private') : 'channel privacy';
        memberCount.textContent = data.memberCount + ' online';
        updateResetBtnVisibility();
        clearReply();
        renderHistory(data.history);
        if(data.becameOwner){
          addSystemLine('you are the owner of this channel');
        }
        break;

      case 'needCode':
        openCodeModal(data.channel);
        break;

      case 'message':
        appendMessage(data);
        typingUsers.delete(data.id);
        renderTypingLine();
        if(data.id !== myId) checkMention(data.text || '');
        break;

      case 'system':
        addSystemLine(data.text);
        break;

      case 'presence':
        memberCount.textContent = data.memberCount + ' online';
        break;

      case 'privacyChanged':
        isPrivate = data.private;
        lockBtn.textContent = isPrivate ? '🔒' : '🔓';
        updateResetBtnVisibility();
        break;

      case 'error':
        addSystemLine('error: ' + data.text);
        break;

      case 'typing':
        markTyping(data.id, data.name);
        break;

      case 'ownerChanged':
        isOwner = data.isOwner;
        lockBtn.title = isOwner ? (isPrivate ? 'make public' : 'make private') : 'channel privacy';
        updateResetBtnVisibility();
        break;

      case 'reaction':
        updateReactionUI(data.mid, data.reactions);
        break;

      case 'channelReset':
        clearReply();
        speaker.innerHTML = '<div class="empty-static">— static —<br>no transmissions on this channel yet</div>';
        break;
      case 'inviteReceived':
        pendingInviteChannel = data.channel;
        inviteBannerTitle.textContent = data.fromName + ' invited you to channel ' + String(data.channel).padStart(2,'0');
        inviteBannerBackdrop.classList.add('show');
        break;
      case 'inviteSent':
        addSystemLine(data.delivered ? ('invite sent to ' + data.toName) : ('invite sent to ' + data.toName + ', they will see it when they open the app'));
        break;
      case 'messageDeleted':
        var deadDiv = speaker.querySelector('[data-mid="' + data.mid + '"]');
        if(deadDiv) deadDiv.remove();
        if(speaker.children.length === 0){
          speaker.innerHTML = '<div class="empty-static">— static —<br>no transmissions on this channel yet</div>';
        }
        break;
      case 'members':
        channelMembers = data.members || [];
        break;
      case 'banned':
        speaker.innerHTML = '<div class="empty-static">— static —<br>you were banned from this channel</div>';
        addSystemLine('you were banned from this channel');
        break;
      case 'banResult':
        addSystemLine(data.kicked ? (data.name + ' was banned (' + data.mode + ')') : ('ban recorded for ' + data.name));
        if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type:'listBans' }));
        break;
      case 'unbanResult':
        addSystemLine(data.name + ' was unbanned');
        if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type:'listBans' }));
        break;
      case 'banList':
        renderBanList(data.names || []);
        break;
    }
  }

  function renderHistory(history){
    speaker.innerHTML = '';
    if(!history || history.length === 0){
      speaker.innerHTML = '<div class="empty-static">— static —<br>no transmissions on this channel yet</div>';
      return;
    }
    history.forEach(appendMessage);
  }

  function appendMessage(m){
    var emptyNotice = speaker.querySelector('.empty-static');
    if(emptyNotice) emptyNotice.remove();

    var div = document.createElement('div');
    div.className = 'transmission' + (m.id === myId ? ' mine' : '');
    div.setAttribute('data-mid', m.mid || '');
    var time = new Date(m.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    var html = '<div class="who">' + escapeHtml(m.name) + '<span class="when">' + time + '</span></div>';

    if(m.replyTo){
      html += '<div class="reply-quote"><b>' + escapeHtml(m.replyTo.name) + '</b> ' + escapeHtml(m.replyTo.text || 'gif') + '</div>';
    }
    if(m.text){
      html += '<span class="msg-text" data-raw="' + escapeHtml(m.text) + '">' + highlightMentions(escapeHtml(censor(m.text))) + '</span>';
    }
    if(m.image){
      html += '<img class="gif-img" src="' + m.image + '">';
      rememberChannelImage(m.image);
    }

    var mid = m.mid || '';
    html += '<div class="reaction-row" id="rx-' + mid + '"></div>';
    html += '<div class="emoji-strip" id="es-' + mid + '">' + EMOJI_SET.map(function(e){ return '<span data-emoji="' + e + '">' + e + '</span>'; }).join('') + '</div>';
    html += '<div class="msg-actions"><button class="react-toggle">+ react</button><button class="reply-toggle">↩ reply</button><button class="delete-toggle">🗑 delete</button></div>';

    div.innerHTML = html;
    speaker.appendChild(div);
    speaker.scrollTop = speaker.scrollHeight;

    var gifImgEl = div.querySelector('.gif-img');
    if(gifImgEl){
      gifImgEl.addEventListener('click', function(){ openZoom(gifImgEl.src); });
    }

    if(mid){
      div.querySelector('.react-toggle').addEventListener('click', function(){
        div.querySelector('.emoji-strip').classList.toggle('show');
      });
      div.querySelectorAll('.emoji-strip span').forEach(function(sp){
        sp.addEventListener('click', function(){
          if(ws && ws.readyState === WebSocket.OPEN){
            ws.send(JSON.stringify({ type:'react', mid: mid, emoji: sp.getAttribute('data-emoji') }));
          }
          div.querySelector('.emoji-strip').classList.remove('show');
        });
      });
      div.querySelector('.reply-toggle').addEventListener('click', function(){
        setReply(mid, m.name, m.text || '');
      });
      div.querySelector('.delete-toggle').addEventListener('click', function(){
        if(!confirm('delete this message?')) return;
        if(ws && ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({ type:'deleteMessage', mid: mid }));
        }
      });
      if(m.reactions) updateReactionUI(mid, m.reactions);
    }
  }

  function updateReactionUI(mid, reactions){
    var row = document.getElementById('rx-' + mid);
    if(!row) return;
    row.innerHTML = '';
    Object.keys(reactions || {}).forEach(function(emoji){
      var users = reactions[emoji];
      if(!users || users.length === 0) return;
      var chip = document.createElement('span');
      chip.className = 'reaction-chip' + (users.indexOf(myId) >= 0 ? ' mine' : '');
      chip.textContent = emoji + ' ' + users.length;
      chip.addEventListener('click', function(){
        if(ws && ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({ type:'react', mid: mid, emoji: emoji }));
        }
      });
      row.appendChild(chip);
    });
  }

  function addSystemLine(text){
    var emptyNotice = speaker.querySelector('.empty-static');
    if(emptyNotice) emptyNotice.remove();
    var div = document.createElement('div');
    div.className = 'system-line';
    div.textContent = text;
    speaker.appendChild(div);
    speaker.scrollTop = speaker.scrollHeight;
  }

  function joinChannel(ch, code){
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    speaker.innerHTML = '<div class="empty-static">tuning in...</div>';
    ws.send(JSON.stringify({ type:'join', channel: ch, name: getName(), code: code || null, clientId: getClientId(), color: getColor() }));
  }

  function switchChannel(ch){
    ch = Math.max(1, Math.min(TOTAL_CHANNELS, ch));
    currentChannel = ch;
    updateFreqReadout();
    clearTypingUsers();
    channelImages = [];
    joinChannel(ch);
    if(notifyOn) resubscribePush();
  }

    }
  });
  inviteBannerDecline.addEventListener('click', function(){
    inviteBannerBackdrop.classList.remove('show');
    pendingInviteChannel = null;
  });

  document.getElementById('tuneUp').addEventListener('click', function(){ switchChannel(currentChannel + 1); });
  document.getElementById('tuneDown').addEventListener('click', function(){ switchChannel(currentChannel - 1); });
  document.getElementById('jumpGo').addEventListener('click', function(){
    var v = parseInt(freqJump.value, 10);
    if(!isNaN(v)) switchChannel(v);
  });
  freqJump.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var v = parseInt(freqJump.value, 10);
      if(!isNaN(v)) switchChannel(v);
    }
  });

  lockBtn.addEventListener('click', function(){
    if(!isOwner){
      addSystemLine('only the channel owner can change privacy');
      return;
    }
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    if(isPrivate){
      ws.send(JSON.stringify({ type:'setPrivate', private:false }));
    }else{
      var code = prompt('set a code for this channel:');
      if(code && code.trim()){
        ws.send(JSON.stringify({ type:'setPrivate', private:true, code: code.trim() }));
      }
    }
  });

  claimOwnerBtn.addEventListener('click', function(){
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    var code = prompt('enter owner code:');
    if(code && code.trim()){
      ws.send(JSON.stringify({ type:'claimOwner', code: code.trim() }));
    }
  });

  var renameDebounce = null;
  nameInput.addEventListener('input', function(){
    var has = nameInput.value.trim().length > 0;
    msgInput.disabled = !has;
    sendBtn.disabled = !has;

    try{ localStorage.setItem('channelwave_name', nameInput.value.trim()); }catch(e){}

    clearTimeout(renameDebounce);
    renameDebounce = setTimeout(function(){
      if(has && ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify({ type:'rename', name: getName() }));
      }
    }, 500);
  });

  // if a name was already saved on this device, enable the mic right away
  if(nameInput.value.trim().length > 0){
    msgInput.disabled = false;
    sendBtn.disabled = false;
  }

  // ---- paste an image straight into the message bar (like WhatsApp/iMessage) ----
  var attachPreview = document.getElementById('attachPreview');
  var attachPreviewImg = document.getElementById('attachPreviewImg');
  var attachPreviewRemove = document.getElementById('attachPreviewRemove');
  var attachedImage = null;

  function setAttachedImage(dataUrl){
    attachedImage = dataUrl;
    attachPreviewImg.src = dataUrl;
    attachPreview.style.display = 'flex';
  }
  function clearAttachedImage(){
    attachedImage = null;
    attachPreviewImg.src = '';
    attachPreview.style.display = 'none';
  }
  attachPreviewRemove.addEventListener('click', clearAttachedImage);

  msgInput.addEventListener('paste', function(e){
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for(var i=0; i<items.length; i++){
      if(items[i].type && items[i].type.indexOf('image/') === 0){
        var file = items[i].getAsFile();
        if(!file) continue;
        e.preventDefault();
        var reader = new FileReader();
        reader.onload = function(){ setAttachedImage(reader.result); };
        reader.readAsDataURL(file);
        break;
      }
    }
  });

  function sendMessage(){
    var text = msgInput.value.trim();
    if(!text && !attachedImage) return;
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type:'message', text: text, image: attachedImage, replyTo: replyingTo }));
    msgInput.value = '';
    if(attachedImage) rememberUsed(attachedImage);
    clearAttachedImage();
    clearReply();
    hideMentionDropdown();
  }
  sendBtn.addEventListener('click', sendMessage);

  // ---- @mention autocomplete ----
  var mentionDropdown = document.getElementById('mentionDropdown');
  var mentionActiveIndex = -1;
  var mentionMatches = [];
  var mentionStart = -1; // index of the '@' currently being typed

  function hideMentionDropdown(){
    mentionDropdown.style.display = 'none';
    mentionDropdown.innerHTML = '';
    mentionMatches = [];
    mentionActiveIndex = -1;
    mentionStart = -1;
  }

  function renderMentionDropdown(){
    mentionDropdown.innerHTML = '';
    mentionMatches.forEach(function(name, i){
      var row = document.createElement('div');
      row.textContent = '@' + name;
      if(i === mentionActiveIndex) row.classList.add('active');
      row.addEventListener('click', function(){ applyMention(name); });
      mentionDropdown.appendChild(row);
    });
    mentionDropdown.style.display = mentionMatches.length ? 'block' : 'none';
  }

  function applyMention(name){
    var value = msgInput.value;
    var before = value.slice(0, mentionStart);
    var afterAt = value.slice(mentionStart);
    var spaceIdx = afterAt.indexOf(' ');
    var after = spaceIdx === -1 ? '' : afterAt.slice(spaceIdx);
    msgInput.value = before + '@' + name + ' ' + after;
    msgInput.focus();
    hideMentionDropdown();
  }

  function updateMentionState(){
    var value = msgInput.value;
    var cursor = msgInput.selectionStart;
    var atIdx = value.lastIndexOf('@', cursor - 1);
    if(atIdx === -1){ hideMentionDropdown(); return; }
    var between = value.slice(atIdx + 1, cursor);
    if(/\s/.test(between)){ hideMentionDropdown(); return; }
    mentionStart = atIdx;
    var query = between.toLowerCase();
    var names = channelMembers.map(function(m){ return m.name; }).filter(function(n){ return n.toLowerCase() !== getName().toLowerCase(); });
    var options = ['everyone'].concat(names);
    mentionMatches = options.filter(function(n){ return n.toLowerCase().indexOf(query) === 0; }).slice(0, 8);
    mentionActiveIndex = mentionMatches.length ? 0 : -1;
    renderMentionDropdown();
  }

  msgInput.addEventListener('keydown', function(e){
    if(mentionMatches.length){
      if(e.key === 'ArrowDown'){ e.preventDefault(); mentionActiveIndex = (mentionActiveIndex + 1) % mentionMatches.length; renderMentionDropdown(); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); mentionActiveIndex = (mentionActiveIndex - 1 + mentionMatches.length) % mentionMatches.length; renderMentionDropdown(); return; }
      if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); applyMention(mentionMatches[mentionActiveIndex]); return; }
      if(e.key === 'Escape'){ hideMentionDropdown(); return; }
    }
    if(e.key === 'Enter') sendMessage();
  });

  var lastTypingSent = 0;
  msgInput.addEventListener('input', function(){
    updateMentionState();
    var now = Date.now();
    if(now - lastTypingSent > 1500 && ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({ type:'typing' }));
      lastTypingSent = now;
    }
  });

  updateFreqReadout();
  connect();
})();
</script>
</body>
</html>
