<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChannelWave</title>
<style>
  :root{
    --dial-black:#0e1013;
    --dial-panel:#181b20;
    --brass:#8fc4ee;
    --brass-dim:#4d7699;
    --amber:#5ec8ff;
    --amber-dim:#2a5570;
    --paper:#dbe6f0;
    --paper-dim:#7c8a99;
    --static:#2c3038;
    --good:#7fbf9f;
    --bad:#d97777;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .radio-app{
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #1c222b 0%, var(--dial-black) 60%);
    color:var(--paper);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 12px 40px;
  }
  .brand{ text-align:center; margin-bottom:12px; }
  .brand .eyebrow{ letter-spacing:.3em; font-size:10px; color:var(--brass-dim); text-transform:uppercase; }
  .brand h1{ font-family:Georgia, serif; font-size:24px; margin:2px 0 0; letter-spacing:.03em; }
  .brand h1 span{ color:var(--amber); }

  .console{
    width:100%; max-width:560px;
    background:linear-gradient(180deg,#1c2027,#12151a);
    border:1px solid #3a3527; border-radius:14px;
    padding:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* compact tuner bar - single row */
  .tuner-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--dial-panel);
    border:1px solid #2a3038;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:10px;
  }
  .tuner-bar button{
    background:linear-gradient(180deg,#1e242c,#141920);
    border:1px solid #3a4450;
    color:var(--paper);
    font-family:inherit;
    font-size:12px;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .freq-readout{
    font-size:19px;
    color:var(--amber);
    text-shadow:0 0 10px rgba(255,157,61,.5);
    min-width:58px;
    text-align:center;
    flex-shrink:0;
  }
  .freq-readout small{ font-size:11px; color:var(--brass-dim); }
  .tuner-bar input[type=number]{
    width:48px;
    background:#0e1116;
    border:1px solid #3a4450;
    color:var(--amber);
    font-family:inherit;
    text-align:center;
    border-radius:6px;
    font-size:13px;
    padding:5px 2px;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--bad);
    flex-shrink:0;
  }
  .status-dot.live{ background:var(--good); box-shadow:0 0 6px var(--good); }
  .lock-btn{
    margin-left:auto;
    font-size:14px !important;
  }

  .sub-row{
    display:flex; gap:8px; margin-bottom:10px; align-items:center;
  }
  .sub-row input{
    flex:1;
    background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:8px 10px; border-radius:8px; font-size:13px;
  }
  .member-count{ font-size:11px; color:var(--paper-dim); white-space:nowrap; }

  .speaker{
    background:#0b0d10; border:1px solid #2a3038; border-radius:10px;
    padding:10px; height:320px; overflow-y:auto;
    display:flex; flex-direction:column; gap:7px;
  }
  .speaker::-webkit-scrollbar{ width:8px; }
  .speaker::-webkit-scrollbar-thumb{ background:#3a3527; border-radius:4px; }

  .transmission{
    max-width:82%; padding:7px 10px; border-radius:9px;
    font-size:13px; line-height:1.4; background:#181d24;
    border:1px solid #2a3038; align-self:flex-start;
  }
  .transmission.mine{ align-self:flex-end; background:#1a2a38; border-color:var(--amber-dim); }
  .transmission .who{ font-size:10px; color:var(--brass); margin-bottom:2px; text-transform:uppercase; }
  .transmission.mine .who{ color:var(--amber); }
  .transmission .when{ font-size:9px; color:var(--paper-dim); margin-left:6px; }
  .system-line{ align-self:center; font-size:10.5px; color:var(--paper-dim); font-style:italic; }
  .empty-static{ margin:auto; text-align:center; color:var(--paper-dim); font-size:12px; }

  .mic-row{ display:flex; gap:8px; margin-top:10px; }
  .mic-row input{
    flex:1; background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:10px 12px; border-radius:8px; font-size:14px;
  }
  .mic-row button{
    background:linear-gradient(180deg,var(--amber),#c9701a); border:none; color:#1a1204;
    font-weight:bold; padding:0 18px; border-radius:8px; cursor:pointer;
  }
  .mic-row button:disabled{ opacity:.4; cursor:not-allowed; }

  .footnote{ text-align:center; color:var(--paper-dim); font-size:10px; letter-spacing:.08em; margin-top:14px; max-width:560px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:#181b20; border:1px solid #3a4450; border-radius:12px;
    padding:18px; width:280px; text-align:center;
  }
  .modal h3{ margin:0 0 10px; font-size:14px; color:var(--amber); }
  .modal input{
    width:100%; background:#0e1116; border:1px solid #2a3038; color:var(--paper);
    font-family:inherit; padding:9px; border-radius:8px; margin-bottom:10px; font-size:13px;
  }
  .modal button{
    width:100%; padding:9px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg,var(--amber),#c9701a); color:#1a1204; font-weight:bold;
  }
  .modal .cancel{ background:none; border:1px solid #3a4450; color:var(--paper); margin-top:6px; }
</style>
</head>
<body>
<div class="radio-app">
  <div class="brand">
    <div class="eyebrow">frequency-based transmission unit</div>
    <h1>CHANNEL<span>WAVE</span></h1>
  </div>

  <div class="console">
    <div class="tuner-bar">
      <button id="tuneDown">◄</button>
      <div class="freq-readout" id="freqReadout">01<small>/100</small></div>
      <button id="tuneUp">►</button>
      <input type="number" id="freqJump" min="1" max="100" value="1">
      <button id="jumpGo">GO</button>
      <div class="status-dot" id="statusDot" title="connection status"></div>
      <button class="lock-btn" id="lockBtn" title="channel privacy">🔓</button>
    </div>

    <div class="sub-row">
      <input id="nameInput" maxlength="18" placeholder="pick a name">
      <span class="member-count" id="memberCount"></span>
    </div>

    <div class="speaker" id="speaker">
      <div class="empty-static">connecting...</div>
    </div>

    <div class="mic-row">
      <input id="msgInput" maxlength="500" placeholder="speak into the mic..." disabled>
      <button id="sendBtn" disabled>SEND</button>
    </div>
  </div>

  <div class="footnote">CHANNELS 01–100 · INSTANT SYNC · FIRST TO JOIN OWNS THE CHANNEL</div>
</div>

<div class="modal-backdrop" id="codeModalBackdrop">
  <div class="modal">
    <h3 id="codeModalTitle">enter channel code</h3>
    <input id="codeModalInput" placeholder="code" maxlength="32">
    <button id="codeModalGo">ENTER</button>
    <button class="cancel" id="codeModalCancel">cancel</button>
  </div>
</div>

<script>
(function(){
  const TOTAL_CHANNELS = 100;
  let currentChannel = 1;
  let ws = null;
  let myId = null;
  let isOwner = false;
  let isPrivate = false;
  let pendingJoinChannel = null;

  const freqReadout = document.getElementById('freqReadout');
  const speaker = document.getElementById('speaker');
  const nameInput = document.getElementById('nameInput');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const lockBtn = document.getElementById('lockBtn');
  const memberCount = document.getElementById('memberCount');
  const freqJump = document.getElementById('freqJump');

  const codeModalBackdrop = document.getElementById('codeModalBackdrop');
  const codeModalTitle = document.getElementById('codeModalTitle');
  const codeModalInput = document.getElementById('codeModalInput');
  const codeModalGo = document.getElementById('codeModalGo');
  const codeModalCancel = document.getElementById('codeModalCancel');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateFreqReadout(){
    freqReadout.innerHTML = String(currentChannel).padStart(2,'0') + '<small>/100</small>';
  }

  function getName(){
    let n = nameInput.value.trim();
    if(!n) n = 'unknown';
    return n.slice(0,18);
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => { statusDot.classList.add('live'); };
    ws.onclose = () => {
      statusDot.classList.remove('live');
      setTimeout(connect, 1500);
    };
    ws.onerror = () => {};

    ws.onmessage = (evt) => {
      let data;
      try{ data = JSON.parse(evt.data); }catch(e){ return; }
      handleServerMessage(data);
    };
  }

  function handleServerMessage(data){
    switch(data.type){
      case 'hello':
        myId = data.id;
        joinChannel(currentChannel);
        break;
      case 'joined':
        isOwner = data.isOwner;
        isPrivate = data.private;
        lockBtn.textContent = isPrivate ? '🔒' : '🔓';
        lockBtn.title = isOwner ? (isPrivate ? 'make public' : 'make private') : 'channel privacy';
        memberCount.textContent = data.memberCount + ' online';
        renderHistory(data.history);
        if(data.becameOwner){
          addSystemLine('you are the owner of this channel');
        }
        break;
      case 'needCode':
        openCodeModal(data.channel);
        break;
      case 'message':
        appendMessage(data);
        break;
      case 'system':
        addSystemLine(data.text);
        break;
      case 'presence':
        memberCount.textContent = data.memberCount + ' online';
        break;
      case 'privacyChanged':
        isPrivate = data.private;
        lockBtn.textContent = isPrivate ? '🔒' : '🔓';
        break;
      case 'error':
        addSystemLine('error: ' + data.text);
        break;
    }
  }

  function renderHistory(history){
    speaker.innerHTML = '';
    if(!history || history.length === 0){
      speaker.innerHTML = '<div class="empty-static">— static —<br>no transmissions on this channel yet</div>';
      return;
    }
    history.forEach(appendMessage);
  }

  function appendMessage(m){
    const emptyNotice = speaker.querySelector('.empty-static');
    if(emptyNotice) emptyNotice.remove();
    const div = document.createElement('div');
    div.className = 'transmission' + (m.id === myId ? ' mine' : '');
    const time = new Date(m.t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = '<div class="who">' + escapeHtml(m.name) + '<span class="when">' + time + '</span></div>' + escapeHtml(m.text);
    speaker.appendChild(div);
    speaker.scrollTop = speaker.scrollHeight;
  }

  function addSystemLine(text){
    const emptyNotice = speaker.querySelector('.empty-static');
    if(emptyNotice) emptyNotice.remove();
    const div = document.createElement('div');
    div.className = 'system-line';
    div.textContent = text;
    speaker.appendChild(div);
    speaker.scrollTop = speaker.scrollHeight;
  }

  function joinChannel(ch, code){
    if(ws.readyState !== WebSocket.OPEN) return;
    speaker.innerHTML = '<div class="empty-static">tuning in...</div>';
    ws.send(JSON.stringify({ type:'join', channel: ch, name: getName(), code: code || null }));
  }

  function switchChannel(ch){
    ch = Math.max(1, Math.min(TOTAL_CHANNELS, ch));
    currentChannel = ch;
    updateFreqReadout();
    joinChannel(ch);
  }

  function openCodeModal(ch){
    pendingJoinChannel = ch;
    codeModalTitle.textContent = 'channel ' + String(ch).padStart(2,'0') + ' is private';
    codeModalInput.value = '';
    codeModalBackdrop.classList.add('show');
    codeModalInput.focus();
  }

  codeModalGo.addEventListener('click', () => {
    const code = codeModalInput.value.trim();
    codeModalBackdrop.classList.remove('show');
    if(pendingJoinChannel != null) joinChannel(pendingJoinChannel, code);
  });
  codeModalCancel.addEventListener('click', () => {
    codeModalBackdrop.classList.remove('show');
    // fall back to previous channel view
    speaker.innerHTML = '<div class="empty-static">enter a code to tune in</div>';
  });
  codeModalInput.addEventListener('keydown', (e) => { if(e.key==='Enter') codeModalGo.click(); });

  document.getElementById('tuneUp').addEventListener('click', () => switchChannel(currentChannel+1));
  document.getElementById('tuneDown').addEventListener('click', () => switchChannel(currentChannel-1));
  document.getElementById('jumpGo').addEventListener('click', () => {
    const v = parseInt(freqJump.value,10);
    if(!isNaN(v)) switchChannel(v);
  });
  freqJump.addEventListener('keydown', (e) => {
    if(e.key==='Enter'){ const v=parseInt(freqJump.value,10); if(!isNaN(v)) switchChannel(v); }
  });

  lockBtn.addEventListener('click', () => {
    if(!isOwner){
      addSystemLine('only the channel owner can change privacy');
      return;
    }
    if(isPrivate){
      ws.send(JSON.stringify({ type:'setPrivate', private:false }));
    }else{
      const code = prompt('set a code for this channel:');
      if(code && code.trim()){
        ws.send(JSON.stringify({ type:'setPrivate', private:true, code: code.trim() }));
      }
    }
  });

  nameInput.addEventListener('input', () => {
    const has = nameInput.value.trim().length > 0;
    msgInput.disabled = !has;
    sendBtn.disabled = !has;
  });

  function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type:'message', text }));
    msgInput.value = '';
  }
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => { if(e.key==='Enter') sendMessage(); });

  updateFreqReadout();
  connect();
})();
</script>
</body>
</html>
